name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  backend-checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medverify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d medverify"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medverify?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test_jwt_secret_for_ci_only
      REFRESH_JWT_SECRET: test_refresh_jwt_secret_for_ci_only
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      VERIFICATION_CODE_SECRET: test_verification_code_secret_for_ci_only
      ALLOW_TEST_CODE_PLAINTEXT: true
      ALLOW_DEV_OTP_PLAINTEXT: true
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:5174

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npm run prisma:seed

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Security Audit (High+)
        run: npm audit --audit-level=high
